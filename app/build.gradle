plugins {
    id 'com.android.application'
}

android {
    namespace 'com.laban.rizzkey'
    compileSdk 34

    defaultConfig {
        applicationId "com.laban.rizzkey"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "0.4"
    }

    /* One key for every build, kept in the repo, so a new version installs over
       the old one. A throwaway debug key per build is why 0.2 refused to install. */
    signingConfigs {
        shared {
            storeFile file("../signing/rizz-key.jks")
            storePassword "rizzkey123"
            keyAlias "rizzkey"
            keyPassword "rizzkey123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
