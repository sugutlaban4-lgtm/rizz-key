plugins {
    id 'com.android.application'
}

android {
    namespace 'com.laban.rizzkey'
    compileSdk 34

    defaultConfig {
        applicationId "com.laban.rizzkey"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
