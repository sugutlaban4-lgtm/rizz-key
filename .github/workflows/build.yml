name: Build keyboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK after its version
        run: |
          VERSION=$(grep -o 'versionName "[^"]*"' app/build.gradle | head -1 | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/rizz-key-$VERSION.apk"
          ls -l out

      - name: Publish as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: Rizz key ${{ env.VERSION }} build ${{ github.run_number }}
          body: |
            Install the APK, then open the Rizz key app: it shows whether the keyboard
            is on and opens the right settings for you.
          files: out/rizz-key-${{ env.VERSION }}.apk
          make_latest: true
